  description: >-
    MyScale Cloud provisions and manages clusters (create, modify name / size / replicas / idle period,
    reset password, view status) through the web console at the MyScale Cloud site. As of this catalog,
    cluster lifecycle management is documented as console-only; no public programmatic REST management
    API is documented. The console surfaces per-cluster Connection Details (MYSCALE_CLUSTER_URL, username,
    password) used by the SQL-over-HTTP interface above.
